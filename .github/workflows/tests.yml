name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: Converter + Sketch-Simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt pytest
      - name: Tests ausführen
        run: python -m pytest -v

  arduino:
    name: Sketch für OpenRB-150 kompilieren
    runs-on: ubuntu-latest
    env:
      OPENRB_URL: https://raw.githubusercontent.com/ROBOTIS-GIT/OpenRB-150/master/package_openrb_index.json
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Board-Paket und Bibliothek installieren
        run: |
          arduino-cli core update-index --additional-urls "$OPENRB_URL"
          arduino-cli core install OpenRB-150:samd --additional-urls "$OPENRB_URL"
          arduino-cli lib install Dynamixel2Arduino@0.8.1
      - name: DeltaPlotter kompilieren
        run: arduino-cli compile --fqbn OpenRB-150:samd:OpenRB-150 --warnings all arduino/DeltaPlotter
